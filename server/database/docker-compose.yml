version: '3.9'

services:
  # MongoDB service
  mongo_db:
    container_name: mongo_db_container
    image: mongo:6.0
    ports:
      - 27017:27017
    restart: always
    volumes:
      - mongo_data:/data/db

  # Node api service
  api:
    build: .
    image: nodeapp
    container_name: dealership_api
    ports:
      - 3030:3030
    depends_on:
      - mongo_db
    environment:
      MONGO_URL: mongodb://mongo_db:27017

volumes:
  mongo_data: {}
