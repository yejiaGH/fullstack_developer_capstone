apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership-backend
  labels:
    app: dealership-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dealership-backend
  template:
    metadata:
      labels:
        app: dealership-backend
    spec:
      containers:
      - name: dealership-backend
        image: dealership-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3030
          protocol: TCP
        env:
        - name: MONGO_URL
          value: "mongodb://mongodb:27017"
        - name: PORT
          value: "3030"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: dealership-backend
  labels:
    app: dealership-backend
spec:
  selector:
    app: dealership-backend
  ports:
  - protocol: TCP
    port: 3030
    targetPort: 3030
  type: ClusterIP
