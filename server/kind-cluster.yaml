kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  # The dealership service is published on node port 30880, the same port
  # that server/deployment.yaml asks for.
  - containerPort: 30880
    hostPort: 30880
    listenAddress: "127.0.0.1"
    protocol: TCP
